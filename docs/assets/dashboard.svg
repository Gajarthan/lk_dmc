<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="310" viewBox="0 0 1040 310" role="img" aria-labelledby="title desc">
  <title id="title">lk_dmc — Sri Lanka disaster report archive</title>
  <desc id="desc">An archive of four Disaster Management Centre report categories: situation reports, weather forecasts, river and flood warnings, and landslide warnings. A blue survey board with document, weather, river and slope symbols.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#F7FBFD" stroke-opacity="0.045"/>
    </pattern>
  </defs>
  <rect width="1040" height="310" rx="14" fill="#123C59"/>
  <rect width="1040" height="310" rx="14" fill="url(#grid)"/>
  <path d="M32 49H1008" stroke="#80DBCB" stroke-opacity="0.4"/>
  <g font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="1.2" fill="#80DBCB">
    <text x="32" y="31">GAJARTHAN / LK_DMC</text>
    <text x="1008" y="31" text-anchor="end">SOURCE REPORTS · SRI LANKA</text>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="43" fill="#F7FBFD">
    <text x="32" y="105">Sri Lanka disaster</text>
    <text x="32" y="154">report archive.</text>
  </g>
  <path d="M578 78V172" stroke="#80DBCB" stroke-opacity="0.4"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#F7FBFD">
    <text x="610" y="102" font-size="18">Original PDFs. Extracted evidence.</text>
    <text x="610" y="132" font-size="18">Structured data for reuse.</text>
    <text x="610" y="164" font-size="14" fill="#F3DBAA">From the Disaster Management Centre</text>
  </g>
  <g fill="#1C5671">
