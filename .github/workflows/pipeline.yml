name: pipeline

on:
  workflow_dispatch:
    inputs:
      max_dt:
        description: Seconds per collection/processing stage
        required: false
        default: "300"
  schedule:
    - cron: "30 */2 * * *"

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        dataset:
          - lk_dmc_situation_reports
          - lk_dmc_weather_forecasts
          - lk_dmc_river_water_level_and_flood_warnings
          - lk_dmc_landslide_warnings
    concurrency:
      group: data-${{ matrix.dataset }}
      cancel-in-progress: false
    env:
      DATASET: ${{ matrix.dataset }}
      MAX_SECONDS: ${{ inputs.max_dt || '300' }}
    defaults:
      run:
        shell: bash
        working-directory: project
    steps:
      - uses: actions/checkout@v7
        with:
          path: project
      - uses: actions/checkout@v7
        with:
          ref: data_${{ matrix.dataset }}
          path: dataset
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.9.30"
          python-version: "3.13"
          working-directory: project
      - name: Install locked dependencies and verify
        run: |
          uv sync --locked
          uv run --frozen pytest -q
          uv run --frozen ruff check .
      - name: Collect and process reports
        id: collect
        continue-on-error: true
        run: uv run --frozen dmc scrape "$DATASET" --data-dir ../dataset/data --max-seconds "$MAX_SECONDS"
      - name: Push collected data
        run: |
          cd ../dataset
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "data/$DATASET"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update $DATASET dataset"
          git fetch origin "data_$DATASET"
          git rebase "origin/data_$DATASET"
          git push origin "HEAD:data_$DATASET"
      - name: Publish Hugging Face datasets when configured
        if: steps.collect.outcome == 'success'
        env:
          HUGGING_FACE_USERNAME: ${{ vars.HUGGING_FACE_USERNAME }}
          HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
        run: |
          if [ -z "$HUGGING_FACE_USERNAME" ] && [ -z "$HUGGING_FACE_TOKEN" ]; then
            echo "Hugging Face publication is not configured."
            exit 0
          fi
          uv run --frozen dmc publish "$DATASET" --data-dir ../dataset/data
      - name: Report incomplete collection
        if: steps.collect.outcome == 'failure'
        run: |
          echo "Collection had errors; saved progress, skipped publication."
          exit 1
